name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check sd3_forge tests

      - name: Run unit & synthetic integration tests (no VST3)
        run: pytest -m "not vst3" -v

      - name: Verify CLI & MCP entrypoints outside repo root
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          sd3-forge --help
          sd3-forge-mcp --list-tools >/dev/null

      - name: Verify non-editable wheel install outside repo root
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/clean-venv"
          if [ -x "${RUNNER_TEMP}/clean-venv/bin/python" ]; then
            VENV_BIN="${RUNNER_TEMP}/clean-venv/bin"
          else
            VENV_BIN="${RUNNER_TEMP}/clean-venv/Scripts"
          fi
          "${VENV_BIN}/python" -m pip install --upgrade pip
          "${VENV_BIN}/python" -m pip install .
          cd "${RUNNER_TEMP}"
          "${VENV_BIN}/sd3-forge" --help
          "${VENV_BIN}/sd3-forge-mcp" --list-tools >/dev/null
