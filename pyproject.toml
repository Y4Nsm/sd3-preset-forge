[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd3-preset-forge"
version = "1.0.0"
description = "Deterministic TDD-driven preset engineering forge and compiler for Toontrack Superior Drummer 3"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Y4Nsm" }]
requires-python = ">=3.11"
keywords = [
    "superior-drummer-3",
    "sd3",
    "toontrack",
    "audio",
    "dsp",
    "mcp",
    "claude-code",
    "music-production",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "mido>=1.3",
    "jsonschema>=4.20",
    "pydantic>=2.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
render = [
    "pedalboard>=0.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
sd3-forge = "sd3_forge.cli:main"
sd3-forge-mcp = "sd3_forge.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Y4Nsm/sd3-preset-forge"
Repository = "https://github.com/Y4Nsm/sd3-preset-forge"
Issues = "https://github.com/Y4Nsm/sd3-preset-forge/issues"
Documentation = "https://github.com/Y4Nsm/sd3-preset-forge#readme"

[tool.setuptools.packages.find]
include = ["sd3_forge*"]

[tool.setuptools.package-data]
sd3_forge = ["schemas/*.json", "data/*.yaml", "templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "vst3: tests requiring a locally installed Superior Drummer 3 VST3 plugin",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "W"]
ignore = ["E501"]
