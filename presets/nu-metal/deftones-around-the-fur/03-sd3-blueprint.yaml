metadata:
  preset_id: deftones-around-the-fur
  genre: nu-metal
  reference: Deftones — Around the Fur (1997) / White Pony (2000) | Abe Cunningham
    & Terry Date
mix_mode: internal_sd3
preflight_audit:
  envelope_ahdsr_checked: true
  fx_bands_checked: true
  unused_slots_resolved: true
  part1_mics_only: true
  raw_baseline_planned: true
kit:
  base_kit: Pearl Masterworks
  unload_slots:
  - Tom3
  pieces:
  - slot: KickR
    name: 18x22" Pearl Masterworks
    pitch_semitones: 2.0
    envelope:
      attack_ms: 0
      decay_ms: 280
      release_ms: 170
  - slot: Snare
    name: 6.5x14" Tama Bell Brass
    pitch_semitones: 2.7
    envelope:
      attack_ms: 0
      decay_ms: 480
      release_ms: 260
  - slot: Hats
    name: 15" Paiste 2002 Extra Heavy
    pitch_semitones: 0.0
  - slot: Tom1
    name: 8x10" Pearl Masterworks
    pitch_semitones: 0.0
    envelope:
      attack_ms: 0
      decay_ms: 450
      release_ms: 220
  - slot: Tom2
    name: 9x12" Pearl Masterworks
    pitch_semitones: -0.5
    envelope:
      attack_ms: 0
      decay_ms: 480
      release_ms: 240
  - slot: Tom4
    name: 15x16" Pearl Masterworks
    pitch_semitones: -1.0
    envelope:
      attack_ms: 0
      decay_ms: 560
      release_ms: 280
  - slot: Tom5
    name: 16x18" Pearl Masterworks
    pitch_semitones: -1.5
    envelope:
      attack_ms: 0
      decay_ms: 620
      release_ms: 320
  - slot: Cymbal1
    name: 17" Paiste 2002 Medium Crash
    pitch_semitones: 0.0
  - slot: Cymbal2
    name: 20" Paiste 2002 Medium Crash/Ride
    pitch_semitones: 0.0
  - slot: Cymbal3
    name: 10" Paiste 3000 Splash
    pitch_semitones: 0.0
  - slot: Cymbal4
    name: 22" Zildjian K Constantinople Medium Thin Low Ride
    pitch_semitones: 0.0
  - slot: Cymbal5
    name: 18" Paiste 2002 Medium Crash
    pitch_semitones: 0.0
  - slot: Cymbal6
    name: 18" Paiste 3000 Nuovo China
    pitch_semitones: 0.0
mics:
- channel: Kick In
  fader_db: 2.5
  pan: C
  phase_invert: false
  route_to: Bus 1 (Kick Bus)
  inserts:
  - fx: EQ
    purpose: Limpar sub/papelão e destacar click de batedor
    params:
      HPF: 48 Hz
      Cut_1: 360 Hz, -5.5 dB, Q 1.6
      Boost_1: 4.2 kHz, +9.0 dB, Q 1.3
  - fx: Transient
    purpose: Ataque firme de batedor + controle de sustain (dB)
    params:
      Attack: +6.5 dB
      Sustain: -2.0 dB
- channel: Kick Out
  fader_db: -3.0
  pan: C
  phase_invert: false
  route_to: Bus 1 (Kick Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -18.0
  inserts:
  - fx: EQ
    purpose: Peso de pele ressonante em 58 Hz e limpeza de médios-graves
    params:
      HPF: 52 Hz
      Boost_1: 58 Hz, +3.5 dB, Q 1.4
      Cut_1: 140 Hz, -3.0 dB, Q 1.3
      Cut_2: 310 Hz, -5.5 dB, Q 1.5
      LPF: 7.0 kHz
- channel: Kick Sub
  fader_db: -14.0
  pan: C
  phase_invert: false
  route_to: Bus 1 (Kick Bus)
  inserts:
  - fx: EQ
    purpose: Sub-grave controlado 45-105 Hz
    params:
      HPF: 45 Hz
      LPF: 105 Hz
- channel: Snare Top
  fader_db: 0.0
  pan: C
  phase_invert: false
  route_to: Bus 2 (Snare Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -8.0
  inserts:
  - fx: EQ84
    purpose: Corpo de Bell Brass e crack estilo Terry Date (3 bandas reais)
    params:
      HPF: 90 Hz
      Low: 225 Hz, +2.0 dB
      Mid: 3.2 kHz, +3.0 dB (Hi-Q Off)
      High: 10 kHz, +1.5 dB
  - fx: EQ
    purpose: Domar ring metálico (~350 Hz, ~555 Hz, ~842 Hz e ~1227 Hz)
    params:
      Cut_1: 350 Hz, -11.5 dB, Q 5.0
      Cut_2: 555 Hz, -4.5 dB, Q 5.0
      Cut_3: 842 Hz, -6.5 dB, Q 5.5
      Cut_4: 1227 Hz, -4.5 dB, Q 5.5
  - fx: Comp 76
    purpose: Controlar picos deixando o transiente explodir
    params:
      Ratio: '4:1'
      Attack: '5'
      Release: '2'
      Input: '0.90'
    calibration_targets:
      target_gr_db:
      - 3.0
      - 5.0
- channel: Snare Bottom
  fader_db: -5.5
  pan: C
  phase_invert: true
  route_to: Bus 2 (Snare Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -12.0
  inserts:
  - fx: Frequency Gate
    purpose: Limpar vazamento grave de bumbo mantendo resposta da esteira
    params:
      SideChain_HPF: 450 Hz
      Hold: 45 ms
      Release: 110 ms
  - fx: EQ
    purpose: Brilho de esteira sem embolar graves
    params:
      HPF: 180 Hz
      HighShelf: 8.5 kHz, +2.5 dB
- channel: Hi-Hat
  fader_db: -5.0
  pan: L35
  phase_invert: false
  route_to: Output 1/2
  inserts:
  - fx: EQ
    purpose: Limpar graves, tirar aspereza em 4.2 kHz e abrir ar
    params:
      HPF: 380 Hz
      Cut_1: 4.2 kHz, -6.5 dB, Q 1.6
      HighShelf: 7.5 kHz, +8.0 dB
- channel: Racktom 1
  fader_db: -1.5
  pan: L45
  route_to: Bus 3 (Toms Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -11.0
  inserts:
  - fx: Frequency Gate
    purpose: Controlar sobra de pratos
    params:
      Release: 240 ms
  - fx: EQ
    purpose: Ataque e limpeza de médios-graves (5 bandas)
    params:
      HPF: 80 Hz
      Cut_1: 420 Hz, -3.5 dB, Q 1.5
      Boost_1: 4.0 kHz, +2.5 dB, Q 1.6
- channel: Racktom 2
  fader_db: -1.5
  pan: L15
  route_to: Bus 3 (Toms Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -11.0
  inserts:
  - fx: Frequency Gate
    params:
      Release: 260 ms
  - fx: EQ
    purpose: Ataque e limpeza de médios-graves (5 bandas)
    params:
      HPF: 70 Hz
      Cut_1: 380 Hz, -3.5 dB, Q 1.5
      Boost_1: 3.8 kHz, +2.5 dB, Q 1.6
- channel: Floortom 1
  fader_db: -1.0
  pan: R22
  route_to: Bus 3 (Toms Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -10.0
  inserts:
  - fx: Frequency Gate
    params:
      Release: 320 ms
  - fx: EQ
    purpose: Ataque e limpeza de médios-graves (5 bandas)
    params:
      HPF: 55 Hz
      Cut_1: 320 Hz, -4.0 dB, Q 1.4
      Boost_1: 3.5 kHz, +2.5 dB, Q 1.6
- channel: Floortom 2
  fader_db: -1.0
  pan: R68
  route_to: Bus 3 (Toms Bus)
  sends:
  - bus: Bus 5 (Studio Litho Room Bus)
    level_db: -10.0
  inserts:
  - fx: Frequency Gate
    params:
      Release: 360 ms
  - fx: EQ
    purpose: Ataque e limpeza de médios-graves (5 bandas)
    params:
      HPF: 45 Hz
      Cut_1: 290 Hz, -4.0 dB, Q 1.4
      Boost_1: 3.2 kHz, +2.5 dB, Q 1.6
- channel: OH Dyn
  fader_db: -4.0
  pan: L100/R100
  phase_invert: false
  route_to: Output 1/2
  inserts:
  - fx: EQ
    purpose: Limpar caixa de papelão, domar 4.2-5.5 kHz e compensar ar do mic dinâmico
    params:
      HPF: 250 Hz
      Cut_1: 360 Hz, -3.5 dB, Q 1.3
      Cut_2: 4.2 kHz, -11.5 dB, Q 1.2
      Cut_3: 5.5 kHz, -5.5 dB, Q 1.4
      HighShelf: 7.0 kHz, +15.0 dB
  - fx: Comp 670
    purpose: Cola orgânica nos pratos sem esmagar transientes
    params:
      Threshold: 0.18
    calibration_targets:
      target_gr_db:
      - 1.5
      - 2.5
- channel: Amb Ribbon
  fader_db: -4.5
  pan: L100/R100
  phase_invert: false
  route_to: Output 1/2
  inserts:
  - fx: EQ
    purpose: Focar sala controlando ring em 350 Hz, aspereza em 4.4 kHz e brilho até 14 kHz
    params:
      HPF: 110 Hz
      Cut_1: 350 Hz, -5.5 dB, Q 2.0
      Cut_2: 4.4 kHz, -6.5 dB, Q 1.2
      HighShelf: 8.0 kHz, +4.0 dB
      LPF: 14.0 kHz
  - fx: Comp 76
    purpose: Explosão de sala estilo Terry Date (Part 1 compensation)
    params:
      Ratio: '12:1'
      Attack: '3'
      Release: '1'
      Input: '0.84'
    calibration_targets:
      target_gr_db:
      - 8.0
      - 12.0
  - fx: Tape Simulator
    purpose: Saturação analógica quente na sala (Drive ~35% do curso)
    params:
      Drive: 35%
      Bias: Normal
bleed:
  channels:
  - channel: Snare Bottom
    enabled: true
    level_db: -10.0
    sources:
    - Kick
    - Toms
  - channel: OH Dyn
    enabled: true
    level_db: 0.0
    sources:
    - All
  - channel: Amb Ribbon
    enabled: true
    level_db: 0.0
    sources:
    - All
buses:
- name: Bus 1 (Kick Bus)
  fader_db: -2.5
  route_to: Output 1/2
  sends:
  - bus: Bus 4 (Parallel Slam Bus)
    level_db: -6.0
  inserts:
  - fx: Comp 76
    purpose: Soco consistente mantendo o clique
    params:
      Ratio: '4:1'
      Attack: '6'
      Release: '2'
      Input: '0.90'
    calibration_targets:
      target_gr_db:
      - 3.0
      - 4.0
  - fx: Tape Simulator
    purpose: Densidade harmônica nos graves (~25% do curso)
    params:
      Drive: 25%
  - fx: EQ
    purpose: Limpar médios-graves e reforçar sub/click
    params:
      HPF: 55 Hz
      Boost_1: 58 Hz, +2.0 dB, Q 1.4
      Cut_1: 160 Hz, -2.5 dB, Q 1.2
      Boost_2: 4.5 kHz, +5.5 dB, Q 1.2
- name: Bus 2 (Snare Bus)
  fader_db: 0.0
  route_to: Output 1/2
  sends:
  - bus: Bus 4 (Parallel Slam Bus)
    level_db: -3.0
  inserts:
  - fx: Transient
    purpose: Equilibrar ataque e corpo da Bell Brass (-15..+15 dB)
    params:
      Attack: +1.0 dB
      Sustain: +1.5 dB
  - fx: Punch Exciter 361
    purpose: Presença e densidade sem embolar graves
    params:
      VocalMod: 'On'
      Compression: 25%
      Mix: 22%
  - fx: EQ
    purpose: Controle final de ring na soma Top+Bottom (~350, ~555, ~842 e ~1002 Hz)
    params:
      Cut_1: 350 Hz, -12.5 dB, Q 5.0
      Cut_2: 555 Hz, -4.5 dB, Q 5.0
      Cut_3: 842 Hz, -5.5 dB, Q 5.5
      Cut_4: 1002 Hz, -5.0 dB, Q 5.5
- name: Bus 3 (Toms Bus)
  fader_db: -1.5
  route_to: Output 1/2
  sends:
  - bus: Bus 4 (Parallel Slam Bus)
    level_db: -7.0
  inserts:
  - fx: Comp 76
    params:
      Ratio: '4:1'
      Attack: '5'
      Release: '3'
- name: Bus 4 (Parallel Slam Bus)
  fader_db: -9.5
  route_to: Output 1/2
  inserts:
  - fx: EQ
    purpose: Limpar sub-grave e controlar ring em 350 Hz antes de esmagar
    params:
      HPF: 65 Hz
      Cut_1: 320 Hz, -4.0 dB, Q 1.2
      Cut_2: 350 Hz, -4.5 dB, Q 4.0
  - fx: Comp 76
    purpose: New York / All-Buttons Crush
    params:
      Ratio: All
      Attack: '2'
      Release: '1'
      Input: '0.71'
    calibration_targets:
      target_gr_db:
      - 12.0
      - 18.0
  - fx: Valve Distortion Box
    purpose: Grit sutil estilo console/outboard
    params:
      Overdrive: 20%
      LowPassFilter: 7 kHz
      DryWet: 30%
- name: Bus 5 (Studio Litho Room Bus)
  fader_db: -7.5
  route_to: Output 1/2
  inserts:
  - fx: Room Reverb
    purpose: Simular profundidade Near/Mid de sala na Part 1
    params:
      ReverbTime: 0.75 s
      Decay: 0.55 s
      PreDelay: 18 ms
      Size: 65%
      Damping: 45%
      DryWet: 100%
  - fx: EQ
    params:
      HPF: 115 Hz
      Cut_1: 350 Hz, -4.5 dB, Q 4.0
      LPF: 7.2 kHz
  - fx: Comp 76
    params:
      Ratio: '8:1'
      Attack: '3'
      Release: '2'
      Input: '0.74'
    calibration_targets:
      target_gr_db:
      - 5.0
      - 7.0
master_bus:
  channel: Output 1/2
  fader_db: 2.5
  inserts:
  - fx: EQ
    purpose: Limpeza final de sub e médios-graves (200 Hz, 240 Hz e 350 Hz)
    params:
      HPF: 28 Hz
      Cut_1: 350 Hz, -4.0 dB, Q 2.0
      Cut_2: 240 Hz, -2.5 dB, Q 1.2
      Cut_3: 150 Hz, -2.0 dB, Q 1.2
      Cut_4: 110 Hz, -1.5 dB, Q 1.2
  - fx: Comp 670
    purpose: Cola de bus analógico (1-2 dB GR)
    params:
      Threshold: 0.125
      TimeConstant: Fast/Auto
    calibration_targets:
      target_gr_db: 1.5
  - fx: Tape Simulator
    purpose: Arredondamento de picos e coesão (~18% do curso)
    params:
      Drive: 18%
  - fx: Compressor / Limiter
    purpose: Segurança de True Peak (sem matar transientes)
    params:
      Threshold: -1.5 dB
      Ratio: '8:1'
      Attack: 1 ms
      Release: 50 ms
schema_version: '2.0'
