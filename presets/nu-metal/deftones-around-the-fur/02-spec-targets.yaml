  sub_20_60_db:
    min: -20.0
    max: -4.0
    ideal: -9.5
    unit: "dB"
    severity: "warn"
  low_60_150_db:
    min: -15.0
    max: -3.0
    ideal: -7.0
    unit: "dB"
    severity: "warn"
  low_mid_150_500_db:
    min: -20.0
    max: -6.5
    ideal: -11.5
    unit: "dB"
    severity: "warn"
    hint_high: "Excesso de lama em 200-400 Hz; limpar no EQ do Output 1/2 ou Parallel Slam."
  high_mid_2000_6000_db:
    min: -20.0
    max: -5.5
    ideal: -11.0
    unit: "dB"
    severity: "warn"
  groove_crest_factor_db:
