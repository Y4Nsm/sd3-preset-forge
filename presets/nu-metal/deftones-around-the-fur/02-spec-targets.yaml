    unit: "dB"
    severity: "hard"
    hint_low: "Bus muito comprimido; reduzir Parallel Slam ou Comp 670."
  active_crest_factor_db:
    min: 7.5
    max: 19.0
    ideal: 13.0
    unit: "dB"
    severity: "hard"
  integrated_lufs:
    min: -25.0
    max: -12.0
    ideal: -19.5
    unit: "LUFS"
    severity: "warn"
  lra_lu:
    min: 1.0
    max: 8.0
    ideal: 3.0
    unit: "LU"
    severity: "warn"
  kick_to_snare_peak_diff_db:
    min: -4.5
    max: 4.5
    ideal: -0.5
    unit: "dB"
