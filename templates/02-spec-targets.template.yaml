metadata:
  preset_id: "{{PRESET_ID}}"
  genre: "{{GENRE}}"
  reference_artist: "Artist Name"
  reference_album: "Album Name (Year)"
  mix_mode: "internal_sd3"
  schema_version: "2.0"
  max_warnings: 1

safety:
  true_peak_dbfs:
    min: -12.0
    max: -0.5
    ideal: -1.5
    unit: "dBFS"
    severity: "hard"
    hint_low: "Subir fader master ou makeup gain para evitar bounce baixo demais."
    hint_high: "Reduzir Output 1/2 ou engajar Compressor / Limiter para evitar clipping."
  clipping_samples:
    min: 0
    max: 0
    ideal: 0
    unit: "samples"
    severity: "hard"
    hint_high: "Baixar ganho de saída no Output 1/2 do mixer do SD3."
  lr_balance_db:
    min: -1.5
    max: 1.5
    ideal: 0.0
    unit: "dB"
    severity: "hard"
    hint_low: "Lado direito mais alto; revisar pans de OH/Pratos/Toms."
    hint_high: "Lado esquerdo mais alto; revisar pans de OH/Pratos/Toms."
  kick_stereo_correlation:
    min: 0.80
    max: 1.0
    ideal: 0.96
    unit: "r"
    severity: "hard"
    hint_low: "Kick com abertura excessiva ou fase invertida entre Kick In/Out/Sub."
  snare_stereo_correlation:
    min: 0.55
    max: 1.0
    ideal: 0.82
    unit: "r"
    severity: "hard"
    hint_low: "Checar fase entre Snare Top/Bottom e largura do Room Reverb."
  groove_stereo_correlation:
    min: 0.25
    max: 0.90
    ideal: 0.65
    unit: "r"
    severity: "hard"
    hint_low: "Risco de cancelamento de fase em mono."

kick:
  fundamental_hz:
    min: 48.0
    max: 68.0
    ideal: 58.0
    unit: "Hz"
    severity: "hard"
  sub_30_70_db:
    min: -9.0
    max: -1.0
    ideal: -3.5
    unit: "dB"
    severity: "hard"
  punch_70_130_db:
    min: -12.0
    max: -2.0
    ideal: -5.5
    unit: "dB"
    severity: "warn"
  boxiness_250_550_db:
    min: -35.0
    max: -11.0
    ideal: -18.0
    unit: "dB"
    severity: "warn"
  click_3000_6000_db:
    min: -26.0
    max: -8.0
    ideal: -14.0
    unit: "dB"
    severity: "warn"
  crest_factor_db:
    min: 9.0
    max: 21.0
    ideal: 14.0
    unit: "dB"
    severity: "hard"
  decay_t20_ms:
    min: 80.0
    max: 350.0
    ideal: 180.0
    unit: "ms"
    severity: "warn"

snare_center:
